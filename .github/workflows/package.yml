name: Update package-lock.json

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'  # 每周一凌晨 2:00 UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: develop

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # package-lock.json 中的 git 依赖以 git+ssh:// 形式记录，统一改写为 HTTPS，
      # 保证依赖克隆不依赖 runner 的 SSH 配置。
      - name: Use HTTPS for git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Delete package-lock.json
        run: rm -f package-lock.json

      - name: Regenerate package-lock.json
        run: npm i --package-lock-only --ignore-scripts --no-audit --no-fund --loglevel verbose

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add package-lock.json
          git commit -m "chore: update package-lock.json" || echo "No changes"
          git push origin develop